services:
  postgres:
    image: postgres:16-alpine
    container_name: padosipro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: padosipro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padosipro_dev}
      POSTGRES_DB: padosipro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padosipro -d padosipro"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: padosipro-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data: